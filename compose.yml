services:
  oikos:
    build:
      context: .
      args:
        VITE_PB_URL: ""
        APP_BUILD_BRANCH: ${APP_BUILD_BRANCH:-local}
    image: ghcr.io/kdpuvvadi/oikos:latest
    container_name: oikos
    ports:
      - "${APP_PORT:-8090}:8090"
    environment:
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      ZEPTO_MAIL_API_KEY: "${ZEPTO_MAIL_API_KEY:-}"
      ZEPTO_MAIL_FROM_ADDRESS: "${ZEPTO_MAIL_FROM_ADDRESS:-}"
      ZEPTO_MAIL_FROM_NAME: "${ZEPTO_MAIL_FROM_NAME:-Oikos}"
      WEEKLY_DIGEST_CRON: "${WEEKLY_DIGEST_CRON:-0 8 * * 1}"
    volumes:
      - ./pb_data:/usr/src/app/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
