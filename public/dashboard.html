<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      document.documentElement.classList.add('js');
      if (document.cookie.includes('oikos_session=1')) document.documentElement.classList.add('has-session');
    </script>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/head.js"></script>
  </head>
  <body>
    <oikos-header></oikos-header>
    <oikos-auth-shell id="authPage" class="auth-shell"></oikos-auth-shell>

    <main id="appShell" class="hidden">
      <section id="dashboardPage">
        <div class="page-title">
          <p class="eyebrow">Insights</p>
          <h1>Spending overview</h1>
        </div>

        <div class="dash-kpi-grid" id="dashKpis"></div>

        <div class="dash-main-grid">
          <section class="panel dash-panel dash-panel-wide">
            <div class="dash-panel-head">
              <div>
                <h2>Monthly trend</h2>
                <p class="dash-panel-sub">Spend by month</p>
              </div>
            </div>
            <div id="monthTrendChart" class="chart-canvas"></div>
          </section>

          <section class="panel dash-panel">
            <div class="dash-panel-head">
              <div>
                <h2>Categories</h2>
                <p class="dash-panel-sub">Share of total spend</p>
              </div>
            </div>
            <div id="categoryDonut" class="chart-canvas"></div>
          </section>
        </div>

        <div class="dash-secondary-grid">
          <section class="panel dash-panel">
            <div class="dash-panel-head">
              <div>
                <h2>This month</h2>
                <p class="dash-panel-sub">Daily spend</p>
              </div>
            </div>
            <div id="dailyChart" class="chart-canvas"></div>
          </section>

          <section class="panel dash-panel">
            <div class="dash-panel-head">
              <div>
                <h2>Payment methods</h2>
                <p class="dash-panel-sub">How you pay</p>
              </div>
            </div>
            <div id="paymentChart" class="bars dash-bars"></div>
          </section>

          <section class="panel dash-panel">
            <div class="dash-panel-head">
              <div>
                <h2>Top stores</h2>
                <p class="dash-panel-sub">Highest spend</p>
              </div>
            </div>
            <div id="storeChart" class="bars dash-bars"></div>
          </section>
        </div>

        <section class="panel dash-panel">
          <div class="dash-panel-head">
            <div>
              <h2>Largest expenses</h2>
              <p class="dash-panel-sub">Top individual transactions</p>
            </div>
          </div>
          <div id="topExpenses" class="dash-expense-list"></div>
        </section>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
